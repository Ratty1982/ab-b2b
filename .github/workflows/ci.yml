name: CI

on:
  pull_request:
  push:
    branches:
      - production/phase-1-auth-rbac
      - main
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck-test-build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ab
          POSTGRES_PASSWORD: ab
          POSTGRES_DB: automotive_brands
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ab -d automotive_brands"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ab:ab@localhost:5432/automotive_brands?schema=public
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Prisma generate
        run: npx prisma generate
      - name: Migrate
        run: npx prisma migrate deploy
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and integration tests
        run: npm test
      - name: Production build
        run: npm run build
